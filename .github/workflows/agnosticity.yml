name: agnosticity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  portable-surfaces:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run agnosticity lint
        run: bash bubbles/scripts/agnosticity-lint.sh --verbose

  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED — evidence-admission-hardening-selftest resolves
      # the pre-fix guard commit to prove its fixtures are non-tautological, and a
      # shallow clone makes that `git show` fail the whole selftest.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        run: bash bubbles/scripts/python-env.sh --provision

      - name: Run release hygiene
        run: bash bubbles/scripts/cli.sh release-check

  # The Linux job above cannot catch BSD-userland defects, which is the class
  # that produced every portability failure fixed on 2026-08-02 (jq reserved
  # word, BSD awk, GNU-only `date -d`, bash 3.2). Restricted to pushes on main:
  # macOS runners bill at a 10x multiplier and this job is ~30 minutes.
  release-hygiene-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 is REQUIRED — see the ubuntu job above.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # macOS ships bash 3.2, which cli.sh rejects outright (it needs the 4.0+
      # `declare -A` used by 12+ scripts). Putting Homebrew's bash first covers
      # cli.sh AND every `#!/usr/bin/env bash` selftest it spawns. This runs
      # BEFORE provisioning so every later step is already on bash 4+.
      - name: Install bash 4+
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          "$(brew --prefix)/bin/bash" --version | head -1

      - name: Install validation dependencies
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          bash bubbles/scripts/python-env.sh --provision

      - name: Run release hygiene
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          bash bubbles/scripts/cli.sh release-check