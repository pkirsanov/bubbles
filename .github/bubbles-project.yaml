# Custom quality gates (G100+ range, auto-assigned IDs)
# gates:
#   example-gate:
#     script: scripts/my-check.sh
#     blocking: true
#     description: Example custom quality gate

# Scan pattern extensions for built-in gates
scans:
  # G047: IDOR / Auth Bypass Detection
  idor:
    handlerFilePatterns: 'handler|controller|route|endpoint|api'
    bodyIdentityPatterns:
    authContextPatterns: 'auth_user\|authenticated_user\|CurrentUser\|AuthUser\|FromRequest\|from_request_parts\|Authorization\|Bearer'

  # G048: Silent Decode Failure Detection
  silentDecode:
    patterns:
    errorHandling: ''

# Managed-doc registry overrides
docsRegistryOverrides:
  managedDocs:
    architecture:
      path: README.md
    development:
      path: README.md
  # Add classification: or policy: overrides here only when your repo needs
  # a managed-doc shape that differs from the framework default registry.

  # Code-index provider (opt-in; framework default is `none`)
codeIndex:
  # codebase-memory, NOT codegraph: this repo is ~38% shell (420 of 1,098
  # tracked files) and codegraph cannot parse shell at all, so it would see
  # roughly 3% of the source. Measured here: 1,096 files -> 16,367 nodes in
  # 2.21s / 232 MiB.
  #
  # This buys `impact`/`symbols`/`routes`/`indexed` for ad-hoc structural
  # questions. It does NOT buy test-impact: the provider declares `affected`
  # and `freshness` unsupported rather than approximating them, so
  # test-impact-shadow degrades honestly here instead of proposing a subset.
  adapter: codebase-memory
