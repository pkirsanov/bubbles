<!-- icon-name: sonny-ledger -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#f8f9fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- wheelchair seat back -->
  <path d="M 18 18 L 18 36 L 38 36 L 38 18" />
  <!-- wheelchair seat -->
  <path d="M 16 36 L 40 36 L 40 40 L 16 40 Z" stroke-width="1.5" />
  <!-- large rear wheel -->
  <circle cx="20" cy="48" r="8" />
  <circle cx="20" cy="48" r="2" stroke-width="1.2" />
  <!-- spokes -->
  <path d="M 20 40 L 20 56 M 12 48 L 28 48 M 14 42 L 26 54 M 14 54 L 26 42" stroke-width="1" />
  <!-- small front wheel -->
  <circle cx="38" cy="52" r="4" stroke-width="1.5" />
  <!-- footrest -->
  <path d="M 36 56 L 44 56" stroke-width="1.2" />
  <!-- head circle -->
  <circle cx="28" cy="14" r="5" />
  <!-- breathing tube from mouth area to rear of chair -->
  <path d="M 32 16 C 40 16 42 20 44 24 L 50 24" stroke-width="1.2" />
  <!-- iron lung canister at end of tube -->
  <rect x="50" y="20" width="10" height="14" rx="2" stroke-width="1.5" />
  <path d="M 53 24 L 57 24 M 53 28 L 57 28 M 53 32 L 57 32" stroke-width="1" />
  <!-- open ledger across lap -->
  <path d="M 12 38 L 12 32 L 32 32 L 32 38" stroke-width="1.2" />
  <path d="M 22 32 L 22 38" stroke-width="1.2" />
  <path d="M 14 34 L 20 34 M 14 36 L 20 36 M 24 34 L 30 34 M 24 36 L 30 36" stroke-width="1" />
</svg>
