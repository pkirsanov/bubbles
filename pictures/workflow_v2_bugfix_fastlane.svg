<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 2600 1800" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="background-color: #fdfcf9; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;">
  <defs>
    <filter id="handdrawn" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="handdrawn-thick" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="10" dy="10" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2980b9" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d35400" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad" filter="url(#handdrawn)"/>
    </marker>
    <filter id="icon-ink" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.19 0 0 0 0 0.25 0 0 0 1 0"/>
    </filter>
    <style><![CDATA[
      image[href^="../icons/"] { filter: url(#icon-ink); }
    ]]></style>
  </defs>

  <!-- Frame -->
  <rect x="32" y="32" width="2536" height="1736" rx="28" fill="#fdfcf9" stroke="#2c3e50" stroke-width="8" filter="url(#handdrawn)"/>
  <rect x="72" y="72" width="2456" height="1656" rx="22" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="14,10" filter="url(#handdrawn)"/>

  <!-- Title -->
  <g transform="translate(1300, 116)">
    <g filter="url(#handdrawn-thick)">
      <polygon points="-720,-50 700,-38 736,46 652,72 -700,62 -754,8" fill="#ffffff" stroke="#c0392b" stroke-width="8"/>
    </g>
    <text x="0" y="20" font-size="60" text-anchor="middle" fill="#922b21" letter-spacing="3" filter="url(#handdrawn)">BUGFIX-FASTLANE · THE SMASH-AND-GRAB</text>
    <text x="0" y="64" font-size="26" text-anchor="middle" fill="#c0392b" filter="url(#handdrawn)">reproduce → fix → adversarial test → regression → validate → audit · no spec mill, no detour</text>
  </g>

  <!-- Quote bubbles (Cory + Trevor + Lucy) -->
  <g filter="url(#handdrawn)" font-weight="bold">
    <g transform="translate(160, 250) rotate(-3)">
      <rect x="-18" y="-30" width="490" height="78" rx="12" fill="#ffffff" fill-opacity="0.92" stroke="#2980b9" stroke-width="4"/>
      <text x="0" y="0" font-size="22" fill="#2980b9">REPRODUCE FIRST. ALWAYS.</text>
      <text x="22" y="30" font-size="22" fill="#2980b9">NO REPRO, NO BUG. — CORY</text>
    </g>
    <g transform="translate(2010, 250) rotate(3)">
      <rect x="-18" y="-30" width="500" height="78" rx="12" fill="#ffffff" fill-opacity="0.92" stroke="#c0392b" stroke-width="4"/>
      <text x="0" y="0" font-size="22" fill="#c0392b">TEST MUST FAIL BEFORE THE FIX,</text>
      <text x="22" y="30" font-size="22" fill="#c0392b">PASS AFTER. — TRINITY</text>
    </g>
    <g transform="translate(150, 1660) rotate(-2)">
      <rect x="-18" y="-30" width="510" height="78" rx="12" fill="#ffffff" fill-opacity="0.92" stroke="#8e44ad" stroke-width="4"/>
      <text x="0" y="0" font-size="22" fill="#8e44ad">TAUTOLOGICAL TESTS = SHITHAWKS.</text>
      <text x="22" y="30" font-size="22" fill="#8e44ad">G036 OR GTFO.</text>
    </g>
  </g>

  <!-- Big rule banner above the lane -->
  <g transform="translate(1300, 380)" filter="url(#shadow)">
    <rect x="-720" y="-46" width="1440" height="92" rx="16" fill="#fff5e6" stroke="#d35400" stroke-width="6" filter="url(#handdrawn-thick)"/>
    <text x="0" y="-12" font-size="28" text-anchor="middle" fill="#a04000" font-weight="bold">⚠ THE ONE RULE: ADVERSARIAL REGRESSION TEST</text>
    <text x="0" y="22" font-size="20" text-anchor="middle" fill="#7d6608">a test that FAILS without the fix and PASSES with it · tautological tests are blocked by Gate G036</text>
  </g>

  <!-- =========================================================
       7 STATIONS — single horizontal lane
       ========================================================= -->

  <!-- 1. REPRODUCE -->
  <g transform="translate(220, 720)" filter="url(#shadow)">
    <rect x="-130" y="-130" width="260" height="320" rx="18" fill="#ffffff" stroke="#2980b9" stroke-width="6" filter="url(#handdrawn-thick)"/>
    <circle cx="-110" cy="-110" r="32" fill="#2980b9" filter="url(#handdrawn)"/>
    <text x="-110" y="-100" font-size="34" text-anchor="middle" fill="#fdfcf9" font-weight="bold">1</text>
    <image href="../icons/cory-trevor-smokes.svg" x="-50" y="-90" width="100" height="100"/>
    <text x="0" y="38" font-size="22" text-anchor="middle" fill="#2980b9" font-weight="bold">REPRODUCE</text>
    <text x="0" y="62" font-size="14" text-anchor="middle" fill="#7f8c8d">Cory · bug</text>
    <rect x="-110" y="76" width="220" height="34" rx="8" fill="#d4e6f1" stroke="#2980b9" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="98" font-size="14" text-anchor="middle" fill="#1f618d">G050 reproduce in env</text>
    <rect x="-110" y="118" width="220" height="34" rx="8" fill="#d4e6f1" stroke="#2980b9" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="140" font-size="14" text-anchor="middle" fill="#1f618d">G051 bug packet drafted</text>
    <rect x="-110" y="160" width="220" height="34" rx="8" fill="#d4e6f1" stroke="#2980b9" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="182" font-size="14" text-anchor="middle" fill="#1f618d">G003 actor &amp; impact</text>
  </g>

  <!-- 2. ROOT-CAUSE / DESIGN -->
  <g transform="translate(620, 720)" filter="url(#shadow)">
    <rect x="-130" y="-130" width="260" height="320" rx="18" fill="#ffffff" stroke="#8e44ad" stroke-width="6" filter="url(#handdrawn-thick)"/>
    <circle cx="-110" cy="-110" r="32" fill="#8e44ad" filter="url(#handdrawn)"/>
    <text x="-110" y="-100" font-size="34" text-anchor="middle" fill="#fdfcf9" font-weight="bold">2</text>
    <image href="../icons/sarah-clipboard.svg" x="-50" y="-90" width="100" height="100"/>
    <text x="0" y="38" font-size="22" text-anchor="middle" fill="#8e44ad" font-weight="bold">ROOT-CAUSE</text>
    <text x="0" y="62" font-size="14" text-anchor="middle" fill="#7f8c8d">Sarah · design (lite)</text>
    <rect x="-110" y="76" width="220" height="34" rx="8" fill="#ebdef0" stroke="#8e44ad" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="98" font-size="14" text-anchor="middle" fill="#6c3483">G005 fix design recorded</text>
    <rect x="-110" y="118" width="220" height="34" rx="8" fill="#ebdef0" stroke="#8e44ad" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="140" font-size="14" text-anchor="middle" fill="#6c3483">G004 DoD checklist</text>
    <rect x="-110" y="160" width="220" height="34" rx="8" fill="#ebdef0" stroke="#8e44ad" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="182" font-size="14" text-anchor="middle" fill="#6c3483">G022 cross-spec impact</text>
  </g>

  <!-- 3. IMPLEMENT -->
  <g transform="translate(1020, 720)" filter="url(#shadow)">
    <rect x="-130" y="-130" width="260" height="320" rx="18" fill="#ffffff" stroke="#27ae60" stroke-width="6" filter="url(#handdrawn-thick)"/>
    <circle cx="-110" cy="-110" r="32" fill="#27ae60" filter="url(#handdrawn)"/>
    <text x="-110" y="-100" font-size="34" text-anchor="middle" fill="#fdfcf9" font-weight="bold">3</text>
    <image href="../icons/julian-glass.svg" x="-50" y="-90" width="100" height="100"/>
    <text x="0" y="38" font-size="22" text-anchor="middle" fill="#27ae60" font-weight="bold">IMPLEMENT</text>
    <text x="0" y="62" font-size="14" text-anchor="middle" fill="#7f8c8d">Julian · implement</text>
    <rect x="-110" y="76" width="220" height="34" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="98" font-size="14" text-anchor="middle" fill="#1e8449">G011 zero stubs</text>
    <rect x="-110" y="118" width="220" height="34" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="140" font-size="14" text-anchor="middle" fill="#1e8449">G028 reality scan</text>
    <rect x="-110" y="160" width="220" height="34" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="182" font-size="14" text-anchor="middle" fill="#1e8449">G012 fix the code, not test</text>
  </g>

  <!-- 4. TEST (adversarial) -->
  <g transform="translate(1420, 720)" filter="url(#shadow)">
    <rect x="-130" y="-130" width="260" height="320" rx="18" fill="#ffffff" stroke="#27ae60" stroke-width="8" filter="url(#handdrawn-thick)"/>
    <circle cx="-110" cy="-110" r="32" fill="#27ae60" filter="url(#handdrawn)"/>
    <text x="-110" y="-100" font-size="34" text-anchor="middle" fill="#fdfcf9" font-weight="bold">4</text>
    <image href="../icons/trinity-notebook.svg" x="-50" y="-90" width="100" height="100"/>
    <text x="0" y="38" font-size="22" text-anchor="middle" fill="#27ae60" font-weight="bold">ADVERSARIAL</text>
    <text x="0" y="62" font-size="14" text-anchor="middle" fill="#7f8c8d">Trinity · test</text>
    <rect x="-110" y="76" width="220" height="34" rx="8" fill="#fff8d6" stroke="#f1c40f" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="98" font-size="14" text-anchor="middle" fill="#7d6608">★ G036 adversarial test</text>
    <rect x="-110" y="118" width="220" height="34" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="140" font-size="14" text-anchor="middle" fill="#1e8449">G018 real test DBs</text>
    <rect x="-110" y="160" width="220" height="34" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="182" font-size="14" text-anchor="middle" fill="#1e8449">G017 covers fixed path</text>
  </g>

  <!-- 5. REGRESSION -->
  <g transform="translate(1820, 720)" filter="url(#shadow)">
    <rect x="-130" y="-130" width="260" height="320" rx="18" fill="#ffffff" stroke="#d35400" stroke-width="6" filter="url(#handdrawn-thick)"/>
    <circle cx="-110" cy="-110" r="32" fill="#d35400" filter="url(#handdrawn)"/>
    <text x="-110" y="-100" font-size="34" text-anchor="middle" fill="#fdfcf9" font-weight="bold">5</text>
    <image href="../icons/steve-french-paw.svg" x="-50" y="-90" width="100" height="100"/>
    <text x="0" y="38" font-size="22" text-anchor="middle" fill="#d35400" font-weight="bold">REGRESSION</text>
    <text x="0" y="62" font-size="14" text-anchor="middle" fill="#7f8c8d">Steve French · regression</text>
    <rect x="-110" y="76" width="220" height="34" rx="8" fill="#fdebd0" stroke="#d35400" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="98" font-size="14" text-anchor="middle" fill="#a04000">G021 zero baseline regress</text>
    <rect x="-110" y="118" width="220" height="34" rx="8" fill="#fdebd0" stroke="#d35400" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="140" font-size="14" text-anchor="middle" fill="#a04000">G022 cross-spec coherence</text>
    <rect x="-110" y="160" width="220" height="34" rx="8" fill="#fdebd0" stroke="#d35400" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="182" font-size="14" text-anchor="middle" fill="#a04000">G031 UI matrix unbroken</text>
  </g>

  <!-- 6. VALIDATE -->
  <g transform="translate(2140, 720)" filter="url(#shadow)">
    <rect x="-130" y="-130" width="260" height="320" rx="18" fill="#ffffff" stroke="#c0392b" stroke-width="6" filter="url(#handdrawn-thick)"/>
    <circle cx="-110" cy="-110" r="32" fill="#c0392b" filter="url(#handdrawn)"/>
    <text x="-110" y="-100" font-size="34" text-anchor="middle" fill="#fdfcf9" font-weight="bold">6</text>
    <image href="../icons/randy-cheeseburger.svg" x="-50" y="-90" width="100" height="100"/>
    <text x="0" y="38" font-size="22" text-anchor="middle" fill="#c0392b" font-weight="bold">VALIDATE</text>
    <text x="0" y="62" font-size="14" text-anchor="middle" fill="#7f8c8d">Randy · validate</text>
    <rect x="-110" y="76" width="220" height="34" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="98" font-size="14" text-anchor="middle" fill="#922b21">G014 DoD complete</text>
    <rect x="-110" y="118" width="220" height="34" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="140" font-size="14" text-anchor="middle" fill="#922b21">G016 raw evidence</text>
    <rect x="-110" y="160" width="220" height="34" rx="8" fill="#fadbd8" stroke="#c0392b" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="182" font-size="14" text-anchor="middle" fill="#922b21">G013 anti-fabrication</text>
  </g>

  <!-- 7. AUDIT / CLOSE — placed below the lane, centered under stations 4-5 -->
  <g transform="translate(1300, 1290)" filter="url(#shadow)">
    <rect x="-160" y="-130" width="320" height="280" rx="18" fill="#ffffff" stroke="#16a085" stroke-width="8" filter="url(#handdrawn-thick)"/>
    <circle cx="-140" cy="-110" r="32" fill="#16a085" filter="url(#handdrawn)"/>
    <text x="-140" y="-100" font-size="34" text-anchor="middle" fill="#fdfcf9" font-weight="bold">7</text>
    <image href="../icons/ted-badge.svg" x="-60" y="-90" width="120" height="120"/>
    <text x="0" y="58" font-size="26" text-anchor="middle" fill="#16a085" font-weight="bold">AUDIT &amp; CLOSE</text>
    <text x="0" y="82" font-size="16" text-anchor="middle" fill="#7f8c8d">Ted · audit · then state.json → done</text>
    <rect x="-140" y="100" width="280" height="34" rx="8" fill="#d1f2eb" stroke="#16a085" stroke-width="3" filter="url(#handdrawn)"/>
    <text x="0" y="122" font-size="14" text-anchor="middle" fill="#0e6655">G027 status ceiling · G023 done · G038 ladder</text>
  </g>

  <!-- Failure escape: any phase fails → loop back to Cory -->
  <g transform="translate(220, 1290)" filter="url(#shadow)">
    <rect x="-150" y="-90" width="300" height="200" rx="14" fill="#fffaf0" stroke="#7f8c8d" stroke-width="5" stroke-dasharray="10,6" filter="url(#handdrawn-thick)"/>
    <image href="../icons/cory-cap.svg" x="-50" y="-80" width="100" height="100"/>
    <text x="0" y="44" font-size="20" text-anchor="middle" fill="#7f8c8d" font-weight="bold">FAILURE LOOP</text>
    <text x="0" y="68" font-size="13" text-anchor="middle" fill="#7f8c8d">any phase fails →</text>
    <text x="0" y="86" font-size="13" text-anchor="middle" fill="#7f8c8d">back to Cory · update bug packet</text>
  </g>

  <!-- =========================================================
       MAIN FLOW ARROWS — single linear lane 1→2→3→4→5→6 then ↓ to 7
       ========================================================= -->
  <g fill="none" filter="url(#handdrawn)" stroke-linecap="round">
    <path d="M 350,720 L 490,720" stroke="#2980b9" stroke-width="7" marker-end="url(#arrow-blue)"/>
    <path d="M 750,720 L 890,720" stroke="#8e44ad" stroke-width="7" marker-end="url(#arrow-purple)"/>
    <path d="M 1150,720 L 1290,720" stroke="#27ae60" stroke-width="7" marker-end="url(#arrow-green)"/>
    <path d="M 1550,720 L 1690,720" stroke="#27ae60" stroke-width="7" marker-end="url(#arrow-green)"/>
    <path d="M 1950,720 L 2010,720" stroke="#d35400" stroke-width="7" marker-end="url(#arrow-orange)"/>

    <!-- 6 → 7: down to audit -->
    <path d="M 2140,910 C 2140,1100 1700,1180 1460,1290" stroke="#c0392b" stroke-width="7" marker-end="url(#arrow-red)"/>

    <!-- Failure loop — short fat back-arrows at each station bottom edge -->
    <path d="M 220,910 C 220,1100 220,1200 220,1200" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="8,5"/>
    <path d="M 620,910 L 280,1230" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>
    <path d="M 1020,910 L 320,1280" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>
    <path d="M 1420,910 L 360,1300" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>
    <path d="M 1820,910 L 380,1320" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>
    <path d="M 2140,910 L 400,1340" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-orange)"/>

    <!-- AUDIT → close arrow (off page) -->
    <path d="M 1460,1290 L 1620,1290" stroke="#16a085" stroke-width="7" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Tag DONE -->
  <g transform="translate(1700, 1290)" filter="url(#handdrawn)">
    <rect x="-10" y="-30" width="200" height="60" rx="10" fill="#16a085" stroke="#0e6655" stroke-width="4"/>
    <text x="90" y="10" font-size="32" text-anchor="middle" fill="#fdfcf9" font-weight="bold">DONE ✓</text>
  </g>

  <!-- Side note: bypass conditions -->
  <g transform="translate(2030, 1290)" filter="url(#handdrawn)">
    <rect x="-160" y="-90" width="340" height="200" rx="14" fill="#fff5e6" stroke="#d35400" stroke-width="4" stroke-dasharray="10,6"/>
    <text x="0" y="-58" font-size="20" text-anchor="middle" fill="#a04000" font-weight="bold">WHEN TO ESCAPE</text>
    <text x="0" y="-30" font-size="14" text-anchor="middle" fill="#7d6608">FASTLANE → FULL-DELIVERY:</text>
    <text x="0" y="-8" font-size="13" text-anchor="middle" fill="#7d6608">• fix changes spec/design ownership</text>
    <text x="0" y="12" font-size="13" text-anchor="middle" fill="#7d6608">• new use case or actor needed</text>
    <text x="0" y="32" font-size="13" text-anchor="middle" fill="#7d6608">• schema migration required</text>
    <text x="0" y="52" font-size="13" text-anchor="middle" fill="#7d6608">• 3+ scopes worth of work</text>
    <text x="0" y="80" font-size="14" text-anchor="middle" fill="#a04000" font-weight="bold">→ Lahey escalates upstream</text>
  </g>

  <!-- Bottom legend -->
  <g transform="translate(105, 1690)" filter="url(#handdrawn)" font-weight="bold">
    <rect x="-8" y="-26" width="2400" height="56" rx="14" fill="#ffffff" fill-opacity="0.92" stroke="#2c3e50" stroke-width="3"/>
    <text x="0" y="0" font-size="20" fill="#2c3e50">LEGEND:</text>
    <line x1="120" y1="-6" x2="220" y2="-6" stroke="#c0392b" stroke-width="6"/>
    <text x="240" y="0" font-size="16" fill="#c0392b">happy path (7 phases)</text>
    <line x1="510" y1="-6" x2="610" y2="-6" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="8,5"/>
    <text x="630" y="0" font-size="16" fill="#7f8c8d">failure loop → back to Cory</text>
    <text x="990" y="0" font-size="16" fill="#7d6608">★ G036 = the rule that makes fastlane defensible</text>
    <text x="1810" y="0" font-size="16" fill="#16a085">CLOSE = state.json status: done · spec untouched</text>
  </g>

</svg>
