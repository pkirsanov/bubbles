<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 2600 1800" xmlns="http://www.w3.org/2000/svg" style="background-color: #fdfcf9; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;">
  <title>Bubbles High-Level Agent Call Chain Overlay</title>
  <desc>TPB style infographic showing how bubbles.workflow, bubbles.super, bubbles.iterate, bubbles.goal, bubbles.sprint, and bubbles.releases call or route downstream agents across common high-level scenarios.</desc>
  <defs>
    <filter id="handdrawn" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="handdrawn-thick" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="10" dy="10" stdDeviation="4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2980b9" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27ae60" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d35400" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b" filter="url(#handdrawn)"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d" filter="url(#handdrawn)"/>
    </marker>
    <filter id="icon-ink" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.19 0 0 0 0 0.25 0 0 0 1 0"/>
    </filter>
    <style><![CDATA[
      image[href^="../icons/"] { filter: url(#icon-ink); }
    ]]></style>
  </defs>

  <rect x="32" y="32" width="2536" height="1736" rx="28" fill="#fdfcf9" stroke="#2c3e50" stroke-width="8" filter="url(#handdrawn)"/>
  <rect x="72" y="72" width="2456" height="1656" rx="22" fill="none" stroke="#2980b9" stroke-width="4" stroke-dasharray="14,10" filter="url(#handdrawn)"/>

  <g transform="translate(1300, 112)">
    <g filter="url(#handdrawn-thick)">
      <polygon points="-790,-50 760,-42 798,44 710,72 -768,62 -825,8" fill="#ffffff" stroke="#2c3e50" stroke-width="8"/>
      <path d="M -752,-28 L 728,-18" fill="none" stroke="#2980b9" stroke-width="4"/>
      <path d="M -735,-8 L 710,2" fill="none" stroke="#2980b9" stroke-width="4"/>
    </g>
    <text x="0" y="18" font-size="58" text-anchor="middle" fill="#2c3e50" letter-spacing="3" filter="url(#handdrawn)">HIGH-LEVEL CALL CHAINS</text>
    <text x="0" y="62" font-size="25" text-anchor="middle" fill="#7f8c8d" filter="url(#handdrawn)">who calls whom when the request is bigger than one specialist</text>
  </g>

  <g filter="url(#handdrawn)">
    <rect x="115" y="226" width="2370" height="180" rx="24" fill="#e8f4fd" stroke="#2980b9" stroke-width="6"/>
    <rect x="115" y="486" width="2370" height="905" rx="24" fill="#ffffff" fill-opacity="0.62" stroke="#2c3e50" stroke-width="5" stroke-dasharray="18,12"/>
    <rect x="115" y="1475" width="2370" height="150" rx="24" fill="#fff6cf" stroke="#d35400" stroke-width="6"/>
  </g>

  <g font-weight="bold" filter="url(#handdrawn)">
    <text x="172" y="275" font-size="28" fill="#2980b9">ENTRY LAYER</text>
    <text x="172" y="323" font-size="25" fill="#2c3e50">The high-level agents decide the operating mode, then dispatch to owner chains. They do not erase ownership boundaries.</text>
    <text x="172" y="358" font-size="22" fill="#7f8c8d">Solid arrows are normal delegation. Dashed arrows are advisory or rework routing.</text>
  </g>

  <g font-weight="bold">
    <g transform="translate(390, 596)" filter="url(#shadow)">
      <rect x="-115" y="-108" width="230" height="216" rx="18" fill="#ffffff" stroke="#2980b9" stroke-width="6" filter="url(#handdrawn-thick)"/>
      <image href="../icons/bubbles-glasses.svg" x="-54" y="-96" width="108" height="108"/>
      <text x="0" y="46" font-size="20" text-anchor="middle" fill="#2980b9">workflow</text>
      <text x="0" y="74" font-size="14" text-anchor="middle" fill="#7f8c8d">universal start</text>
    </g>
    <g transform="translate(780, 596)" filter="url(#shadow)">
      <rect x="-115" y="-108" width="230" height="216" rx="18" fill="#ffffff" stroke="#16a085" stroke-width="6" filter="url(#handdrawn-thick)"/>
      <image href="../icons/lahey-badge.svg" x="-54" y="-96" width="108" height="108"/>
      <text x="0" y="46" font-size="20" text-anchor="middle" fill="#16a085">super</text>
      <text x="0" y="74" font-size="14" text-anchor="middle" fill="#7f8c8d">intent + ops</text>
    </g>
    <g transform="translate(1170, 596)" filter="url(#shadow)">
      <rect x="-115" y="-108" width="230" height="216" rx="18" fill="#ffffff" stroke="#2980b9" stroke-width="6" filter="url(#handdrawn-thick)"/>
      <image href="../icons/jacob-hardhat.svg" x="-54" y="-96" width="108" height="108"/>
      <text x="0" y="46" font-size="20" text-anchor="middle" fill="#2980b9">iterate</text>
      <text x="0" y="74" font-size="14" text-anchor="middle" fill="#7f8c8d">next slice</text>
    </g>
    <g transform="translate(1560, 596)" filter="url(#shadow)">
      <rect x="-115" y="-108" width="230" height="216" rx="18" fill="#ffffff" stroke="#2980b9" stroke-width="6" filter="url(#handdrawn-thick)"/>
      <image href="../icons/tyrone-chain.svg" x="-54" y="-96" width="108" height="108"/>
      <text x="0" y="46" font-size="20" text-anchor="middle" fill="#2980b9">goal</text>
      <text x="0" y="74" font-size="14" text-anchor="middle" fill="#7f8c8d">one loop</text>
    </g>
    <g transform="translate(1950, 596)" filter="url(#shadow)">
      <rect x="-115" y="-108" width="230" height="216" rx="18" fill="#ffffff" stroke="#8e44ad" stroke-width="6" filter="url(#handdrawn-thick)"/>
      <image href="../icons/erica-doublestack.svg" x="-54" y="-96" width="108" height="108"/>
      <text x="0" y="46" font-size="20" text-anchor="middle" fill="#8e44ad">sprint</text>
      <text x="0" y="74" font-size="14" text-anchor="middle" fill="#7f8c8d">multi-goal</text>
    </g>
    <g transform="translate(2340, 596)" filter="url(#shadow)">
      <rect x="-115" y="-108" width="230" height="216" rx="18" fill="#ffffff" stroke="#27ae60" stroke-width="6" filter="url(#handdrawn-thick)"/>
      <image href="../icons/sonny-ledger.svg" x="-54" y="-96" width="108" height="108"/>
      <text x="0" y="46" font-size="20" text-anchor="middle" fill="#27ae60">releases</text>
      <text x="0" y="74" font-size="14" text-anchor="middle" fill="#7f8c8d">phase packet</text>
    </g>
  </g>

  <g filter="url(#handdrawn)" fill="none" stroke-linecap="round">
    <path d="M 505,596 L 665,596" stroke="#16a085" stroke-width="7" stroke-dasharray="14,9" marker-end="url(#arrow-green)"/>
    <path d="M 895,596 L 1055,596" stroke="#2980b9" stroke-width="7" marker-end="url(#arrow-blue)"/>
    <path d="M 1285,596 L 1445,596" stroke="#2980b9" stroke-width="7" marker-end="url(#arrow-blue)"/>
    <path d="M 1675,596 L 1835,596" stroke="#8e44ad" stroke-width="7" stroke-dasharray="14,9" marker-end="url(#arrow-purple)"/>
    <path d="M 2065,596 L 2225,596" stroke="#27ae60" stroke-width="7" stroke-dasharray="14,9" marker-end="url(#arrow-green)"/>
  </g>

  <g font-weight="bold" filter="url(#handdrawn)">
    <rect x="205" y="760" width="690" height="260" rx="20" fill="#f4ecf7" stroke="#8e44ad" stroke-width="5"/>
    <text x="245" y="806" font-size="27" fill="#8e44ad">A. artifact creation route</text>
    <text x="245" y="850" font-size="22" fill="#2c3e50">workflow or iterate picks the owner chain:</text>
    <text x="245" y="890" font-size="22" fill="#2c3e50">analyst - ux - design - plan</text>
    <text x="245" y="930" font-size="20" fill="#7f8c8d">Spec truth, UX truth, design truth, then scope truth.</text>
    <text x="245" y="970" font-size="20" fill="#7f8c8d">No one else rewrites those owned surfaces.</text>

    <rect x="955" y="760" width="690" height="260" rx="20" fill="#eaf8ee" stroke="#27ae60" stroke-width="5"/>
    <text x="995" y="806" font-size="27" fill="#27ae60">B. delivery route</text>
    <text x="995" y="850" font-size="22" fill="#2c3e50">goal drives the convergence loop:</text>
    <text x="995" y="890" font-size="22" fill="#2c3e50">implement - test - docs - validate - audit</text>
    <text x="995" y="930" font-size="20" fill="#7f8c8d">If a gate fails, the packet goes back to the owner.</text>
    <text x="995" y="970" font-size="20" fill="#7f8c8d">It keeps looping while the issue is fixable.</text>

    <rect x="1705" y="760" width="690" height="260" rx="20" fill="#fff6cf" stroke="#d35400" stroke-width="5"/>
    <text x="1745" y="806" font-size="27" fill="#d35400">C. sprint route</text>
    <text x="1745" y="850" font-size="22" fill="#2c3e50">sprint runs several goal loops under one clock:</text>
    <text x="1745" y="890" font-size="22" fill="#2c3e50">rank - execute - validate - reorder - stop clean</text>
    <text x="1745" y="930" font-size="20" fill="#7f8c8d">Good for mixed bugs, hardening, docs, and ops.</text>
    <text x="1745" y="970" font-size="20" fill="#7f8c8d">It reports unfinished work instead of pretending.</text>

    <rect x="205" y="1095" width="690" height="250" rx="20" fill="#d1f2eb" stroke="#16a085" stroke-width="5"/>
    <text x="245" y="1141" font-size="27" fill="#16a085">D. super route</text>
    <text x="245" y="1185" font-size="22" fill="#2c3e50">super resolves fuzzy requests and framework ops:</text>
    <text x="245" y="1225" font-size="22" fill="#2c3e50">commands - setup - status - readiness - advice</text>
    <text x="245" y="1265" font-size="20" fill="#7f8c8d">Use for how-to, command surfaces, and repo health.</text>
    <text x="245" y="1305" font-size="20" fill="#7f8c8d">Then route to a controller if work must happen.</text>

    <rect x="955" y="1095" width="690" height="250" rx="20" fill="#fef5e7" stroke="#d35400" stroke-width="5"/>
    <text x="995" y="1141" font-size="27" fill="#d35400">E. release route</text>
    <text x="995" y="1185" font-size="22" fill="#2c3e50">releases owns packets and carry-forward truth:</text>
    <text x="995" y="1225" font-size="22" fill="#2c3e50">vision - features - actions - deployment - ops</text>
    <text x="995" y="1265" font-size="20" fill="#7f8c8d">It coordinates Product Direction Surfaces and phase docs.</text>
    <text x="995" y="1305" font-size="20" fill="#7f8c8d">Execution still routes to the proper owner.</text>

    <rect x="1705" y="1095" width="690" height="250" rx="20" fill="#eef0f3" stroke="#7f8c8d" stroke-width="5"/>
    <text x="1745" y="1141" font-size="27" fill="#7f8c8d">F. closeout route</text>
    <text x="1745" y="1185" font-size="22" fill="#2c3e50">validate and audit certify the result:</text>
    <text x="1745" y="1225" font-size="22" fill="#2c3e50">evidence - gates - findings - rework packet</text>
    <text x="1745" y="1265" font-size="20" fill="#7f8c8d">They diagnose and route; they do not steal ownership.</text>
    <text x="1745" y="1305" font-size="20" fill="#7f8c8d">Final status needs the control plane to agree.</text>
  </g>

  <g filter="url(#handdrawn)" fill="none" stroke-linecap="round">
    <path d="M 1170,704 C 900,720 690,735 550,760" stroke="#8e44ad" stroke-width="6" marker-end="url(#arrow-purple)"/>
    <path d="M 1560,704 C 1460,725 1375,735 1300,760" stroke="#27ae60" stroke-width="6" marker-end="url(#arrow-green)"/>
    <path d="M 1950,704 C 2010,720 2035,735 2050,760" stroke="#d35400" stroke-width="6" marker-end="url(#arrow-orange)"/>
    <path d="M 780,704 C 710,865 630,1000 550,1095" stroke="#16a085" stroke-width="6" stroke-dasharray="12,8" marker-end="url(#arrow-green)"/>
    <path d="M 2340,704 C 2140,900 1750,1010 1300,1095" stroke="#d35400" stroke-width="6" stroke-dasharray="12,8" marker-end="url(#arrow-orange)"/>
    <path d="M 1560,704 C 1765,875 1960,1010 2050,1095" stroke="#7f8c8d" stroke-width="6" stroke-dasharray="12,8" marker-end="url(#arrow-gray)"/>
    <path d="M 2050,1095 C 1850,1000 1600,1000 1300,1020" stroke="#c0392b" stroke-width="6" stroke-dasharray="14,8" marker-end="url(#arrow-red)"/>
    <path d="M 1300,1095 C 1100,1000 850,1000 550,1020" stroke="#c0392b" stroke-width="6" stroke-dasharray="14,8" marker-end="url(#arrow-red)"/>
  </g>

  <g filter="url(#handdrawn)" font-weight="bold">
    <text x="172" y="1518" font-size="28" fill="#d35400">READ THIS LIKE A MAP</text>
    <text x="172" y="1564" font-size="24" fill="#2c3e50">workflow is the front gate. super is the supervisor. iterate picks the next slice. goal drives one outcome. sprint drives many. releases owns phase packets.</text>
    <text x="172" y="1604" font-size="22" fill="#7f8c8d">Every path still goes through artifact owners, validation evidence, and audit closeout before anything is truly done.</text>
  </g>

  <g transform="translate(2086, 238) rotate(3)" filter="url(#handdrawn)">
    <rect x="-18" y="-28" width="372" height="104" rx="12" fill="#ffffff" fill-opacity="0.94" stroke="#c0392b" stroke-width="4"/>
    <text x="0" y="0" font-size="21" fill="#c0392b" font-weight="bold">BIGGER THAN ONE AGENT?</text>
    <text x="12" y="30" font-size="21" fill="#c0392b" font-weight="bold">USE A CONTROLLER.</text>
    <text x="24" y="60" font-size="18" fill="#7f8c8d">Then let owners own.</text>
  </g>
</svg>
